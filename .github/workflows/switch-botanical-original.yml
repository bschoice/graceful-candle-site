name: Switch botanical image to original

on:
  push:
    paths:
      - '.github/workflows/switch-botanical-original.yml'

permissions:
  contents: write

jobs:
  update-botanical-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Switch botanical image reference
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = './graceful-candle-botanical-hq.jpg?v=5'
          new = './graceful-candle-botanical-original.jpg?v=20260903-1'
          if old not in text:
              raise SystemExit(f'Expected reference not found: {old}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use original high quality botanical photo"
          git push
