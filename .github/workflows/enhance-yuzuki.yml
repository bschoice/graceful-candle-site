name: Repair Graceful Candle photos

on:
  push:
    paths:
      - '.github/workflows/enhance-yuzuki.yml'

permissions:
  contents: write

jobs:
  enhance-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tools
        run: pip install opencv-contrib-python-headless pillow

      - name: Download fast super-resolution model
        run: curl -L --fail --retry 3 https://github.com/Saafke/FSRCNN_Tensorflow/raw/master/models/FSRCNN_x2.pb -o FSRCNN_x2.pb

      - name: Enhance artist and Yuzuki images
        run: |
          python - <<'PY'
          import cv2
          from pathlib import Path
          from PIL import Image, ImageFilter

          jobs = [
              ('graceful-candle-artist-makiko.jpg', 'graceful-candle-artist-makiko-hq.jpg', (1170, 1306)),
              ('graceful-candle-yuzuki.jpg', 'graceful-candle-yuzuki-hq.jpg', (1086, 1448)),
          ]

          sr = cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('FSRCNN_x2.pb')
          sr.setModel('fsrcnn', 2)

          for source, output, target_size in jobs:
              print('Processing', source, 'bytes=', Path(source).stat().st_size)
              image = cv2.imread(source, cv2.IMREAD_COLOR)
              if image is None:
                  raise SystemExit(f'Could not decode {source}')
              cleaned = cv2.bilateralFilter(image, 5, 20, 20)
              cleaned = cv2.fastNlMeansDenoisingColored(cleaned, None, 1.5, 1.5, 7, 17)
              enlarged = sr.upsample(cleaned)
              enlarged = cv2.cvtColor(enlarged, cv2.COLOR_BGR2RGB)
              result = Image.fromarray(enlarged)
              result = result.resize(target_size, Image.Resampling.LANCZOS)
              result = result.filter(ImageFilter.UnsharpMask(radius=0.8, percent=75, threshold=2))
              result.save(output, 'JPEG', quality=96, subsampling=0, optimize=True)
              print('Saved', output, result.size, 'bytes=', Path(output).stat().st_size)
          PY

      - name: Switch site to repaired filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for old in ['./graceful-candle-artist-makiko.jpg', './graceful-candle-artist-makiko-hq.jpg?v=4']:
              s = s.replace(old, './graceful-candle-artist-makiko-hq.jpg?v=5')
          for old in ['./graceful-candle-yuzuki.jpg?v=3', './graceful-candle-yuzuki.jpg', './graceful-candle-yuzuki-hq.jpg?v=4']:
              s = s.replace(old, './graceful-candle-yuzuki-hq.jpg?v=5')
          for old in ['./graceful-candle-botanical.jpg', './graceful-candle-botanical-hq.jpg?v=4']:
              s = s.replace(old, './graceful-candle-botanical-hq.jpg?v=5')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html graceful-candle-artist-makiko-hq.jpg graceful-candle-yuzuki-hq.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Repair Graceful Candle artist and Yuzuki photos"
            git pull --rebase origin main
            git push
          fi
