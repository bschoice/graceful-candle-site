name: Enhance Yuzuki candle image

on:
  push:
    paths:
      - '.github/workflows/enhance-yuzuki.yml'

permissions:
  contents: write

jobs:
  enhance-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tools
        run: pip install opencv-python-headless pillow

      - name: Enhance Yuzuki image
        run: |
          python - <<'PY'
          import cv2
          from PIL import Image, ImageFilter

          source = 'graceful-candle-yuzuki.jpg'
          image = cv2.imread(source, cv2.IMREAD_COLOR)
          if image is None:
              raise SystemExit(f'Could not read {source}')

          # Smooth JPEG/block artifacts while keeping candle edges and plant details.
          cleaned = cv2.bilateralFilter(image, 7, 28, 28)
          cleaned = cv2.fastNlMeansDenoisingColored(cleaned, None, 2, 2, 7, 19)
          cleaned = cv2.cvtColor(cleaned, cv2.COLOR_BGR2RGB)

          result = Image.fromarray(cleaned)
          result = result.resize((1086, 1448), Image.Resampling.LANCZOS)
          result = result.filter(ImageFilter.UnsharpMask(radius=1.0, percent=85, threshold=2))
          result.save(source, 'JPEG', quality=95, subsampling=0, optimize=True)
          print('Saved enhanced image:', result.size)
          PY

      - name: Commit enhanced image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graceful-candle-yuzuki.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Improve Yuzuki candle image quality"
            git pull --rebase origin main
            git push
          fi

# Fast web-quality enhancement workflow.
